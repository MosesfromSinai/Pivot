{% extends "base.html" %}
{% block title %}Play Viewer{% endblock %}

{% block content %}

<style>
    .pv-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .pv-btn {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 14px;
        cursor: pointer;
        font-family: var(--heading);
        font-size: 16px;
    }

    .pv-btn:hover,
    .pv-btn.active {
        background: var(--synthetic);
        color: white;
    }

    .pv-slider {
        flex: 1;
        min-width: 120px;
        accent-color: #3B7DDD;
        cursor: pointer;
    }

    .pv-time {
        font: 12px var(--mono);
        color: var(--muted);
    }

    .pv-field {
        display: block;
        width: 100%;
        max-height: 380px;
        background: #101115;
        border: 1px solid var(--border);
    }

    .pv-live {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: var(--bg);
        border: 1px solid var(--border);
    }

    .pv-live > div {
        padding: 10px 14px;
        border-right: 1px solid var(--border);
    }

    .pv-live > div:last-child {
        border-right: 0;
    }

    .pv-value {
        font: 20px var(--mono);
    }

    .pv-panel {
        padding: 14px 20px;
    }

    .pv-stats .stat-big {
        font-size: 36px;
    }

    .pv-select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 9px;
        font-family: var(--mono);
        max-width: 100%;
    }
</style>
{% endblock %}
